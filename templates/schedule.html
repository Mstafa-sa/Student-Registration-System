<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدولي الدراسي</title>
    <!-- أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ request.url_for('static', path='schedule.css') }}">
</head>
<body>
    <!-- Navbar -->
    <nav>
        <h2><i class="fas fa-school"></i> نظام تسجيل الطلاب</h2>
        <ul>
            <li><a href="/STU/dashboard"><i class="fas fa-home"></i> الرئيسية</a></li>
            <li><a href="/STU/courses"><i class="fas fa-book"></i> تسجيل المواد</a></li>
            <li><a href="/STU/schedule"><i class="fas fa-calendar-alt"></i> جدولي</a></li>
            <li><a href="/STU/log_out"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</a></li>
        </ul>
    </nav>

    <!-- جدول الحصص -->
    <div class="schedule-container">
        <h3><i class="fas fa-calendar-alt"></i> جدول حصصك</h3>

        <table class="schedule-table">
            <thead>
                <tr>
                    <th>الماده موجوده؟</th>
                    <th>اليوم</th>
                    <th>القاعة</th>
                    <th>المدرس</th>
                    <th>الوقت</th>
                    <th>عدد الساعات</th>
                    <th>المادة</th>
                    <th>رمز المساق</th>
                </tr>
            </thead>


            <tbody>
             {%for i in courses%}
                <tr>
                    <td>{{i[9]}}</td>
                    <td>{{i[6]}}</td>
                    <td>{{i[2]}}</td>
                    <td>{{i[4]}}</td>
                    <td>{{i[3]}}</td>
                    <td>{{i[7]}}</td>
                    <td>{{i[5]}}</td>
                    <td>{{i[8]}}</td>
                </tr>
             {%endfor%}

            </tbody>
        </table>
    </div>
</body>
</html>
