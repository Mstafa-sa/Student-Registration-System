<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل حساب جديد</title>
    <!-- أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ request.url_for('static', path='signup.css') }}">
</head>
<body>
    <div class="signup-container">
        <h2><i class="fas fa-user-plus"></i> إنشاء حساب جديد</h2>
        <form method="post" action="/Auth/signup">
            <input type="text" name="name" placeholder="الاسم الكامل" required>
            <input type="email" name="email" placeholder="البريد الإلكتروني" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <input type="password" name="check_password" placeholder="تأكيد كلمة المرور" required>
            <select  name="Specialization" required>
                <option value="">اختر التخصص</option>
                <option value="cs">cs</option>
                <option value="cis">cis</option>
                <option value="match">match</option>
            </select>
            <input type="hidden" name="hid"  value="student">
            <button type="submit"><i class="fas fa-user-check"></i> تسجيل</button>
        </form>
        <p class="login-link">لديك حساب بالفعل؟ <a href="/Auth/login">تسجيل الدخول</a></p>
        {%if message%}
        <p style="color: red">{{message}}</p>
        {%endif%}
    </div>
</body>
</html>
